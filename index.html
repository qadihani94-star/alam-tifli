<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم طفلي - لولو</title>

<style>
* {box-sizing:border-box}
body {
 margin:0;
 font-family:Arial,sans-serif;
 text-align:center;
 background:linear-gradient(135deg,#fff0c9,#d9f5ff);

}

<body>

<header>

<p>هيا نتعلم ونلعب معاً ❤️</p>
</header>

<h2>اختر درساً يا بطل ⭐</h2>

<div class="buttons">
<button onclick="start('letters')">🔤 الحروف العربية</button>
<button onclick="start('numbers')">🔢 الأرقام</button>
<button onclick="start('colors')">🎨 الألوان</button>
<button onclick="start('english')">🇬🇧 الإنجليزية</button>
<button onclick="start('animals')">🐰 الحيوانات</button>
<button onclick="start('fruits')">🍎 الفواكه</button>
</div>

<div class="lesson">
<h2>📚 درس لولو</h2>
<div id="item">🦁</div>
<div id="word">اضغط على أحد الدروس لنبدأ!</div>
</div>

<button class="action" onclick="next()">التالي ⭐</button>
<button class="action" onclick="speak()">🔊 اسمعني</button>

<div class="lesson">
<h2>🏆 شاطر يا بطل!</h2>
<p id="score">عدد الدروس التي تعلمتها: 0</p>
<p>لولو فخور بك ❤️</p>
</div>

<footer>
🌈 عالم طفلي التعليمي
<p>نتعلم ونلعب ونكبر معاً</p>
</footer>

<script>
const lessons = {
letters:[
["أ","أسد 🦁"],["ب","بطة 🦆"],["ت","تفاحة 🍎"],
["ث","ثعلب 🦊"],["ج","جمل 🐪"],["ح","حصان 🐎"],
["خ","خروف 🐑"],["د","دب 🐻"],["ر","ريشة 🪶"],
["س","سمكة 🐟"],["ش","شمس ☀️"]
],
numbers:[
["١","واحد"],["٢","اثنان"],["٣","ثلاثة"],
["٤","أربعة"],["٥","خمسة"],["٦","ستة"],
["٧","سبعة"],["٨","ثمانية"],["٩","تسعة"],["١٠","عشرة"]
],
colors:[
["🔴","أحمر"],["🔵","أزرق"],["🟢","أخضر"],
["🟡","أصفر"],["🟣","بنفسجي"],["⚫","أسود"],["⚪","أبيض"]
],
english:[
["A","Apple - تفاحة 🍎"],["B","Ball - كرة ⚽"],
["C","Cat - قطة 🐱"],["D","Dog - كلب 🐶"],
["E","Elephant - فيل 🐘"]
],
animals:[
["🦁","أسد"],["🐱","قطة"],["🐰","أرنب"],
["🐘","فيل"],["🐪","جمل"],["🐦","عصفور"],
["🐟","سمكة"],["🐴","حصان"]
],
fruits:[
["🍎","تفاح"],["🍌","موز"],["🍇","عنب"],
["🍊","برتقال"],["🍉","بطيخ"],["🍓","فراولة"]
]
};

let current=[];
let index=0;
let score=0;

function start(type){
 current=lessons[type];
 index=0;
 show();
}

function show(){
 document.getElementById("item").innerText=current[index][0];
 document.getElementById("word").innerText=current[index][1];
 speak();
}

function next(){
 if(current.length===0){
  alert("اختر درساً أولاً يا بطل!");
  return;
 }
 index=(index+1)%current.length;
 score++;
 document.getElementById("score").innerText=
 "عدد الدروس التي تعلمتها: "+score;
 show();
}

function speak(){
 let word=document.getElementById("word").innerText;
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
  let msg=new SpeechSynthesisUtterance(word);
  msg.lang="ar-SA";
  msg.rate=0.8;
  speechSynthesis.speak(msg);
 }
}
</script>
